[project]
name = "agent-books"
version = "0.9.1"
license = "Apache-2.0"
description = "Slashbooks — agent-native bookkeeping tools: cash books and opt-in accrual for single-company USD SaaS and services."
authors = [{ name = "Gil Hildebrand" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
books = "bookkeeping.cli:main"

[project.optional-dependencies]
xlsx = ["xlsxwriter==3.2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookkeeping = [
    "templates/entity.json",
    "templates/business-profile.md",
    "templates/trust-policy.json",
    "templates/gitignore-template",
    "procedures/*.md",
]
